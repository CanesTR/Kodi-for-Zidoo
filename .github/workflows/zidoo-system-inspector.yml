name: Build Zidoo System Inspector
on:
  workflow_dispatch:
  push:
    paths:
      - 'diagnostics/zidoo-system-inspector/**'
      - '.github/workflows/zidoo-system-inspector.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Build separate inspector APK
        working-directory: diagnostics/zidoo-system-inspector
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          bash gradlew --no-daemon assembleDebug lintDebug
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Zidoo-System-Inspector-0.1.0
          path: |
            diagnostics/zidoo-system-inspector/app/build/outputs/apk/debug/app-debug.apk
            diagnostics/zidoo-system-inspector/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
